dataset: cars196
data_dir: ./data
model: preact_resnet18
method: guided_sr
cross_device_shuffle: false
resnet_stem_type: imagenet

batch_size: 64
epochs: 200
validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true
final_test_checkpoint: best

learning_rate: 0.05
momentum: 0.9
weight_decay: 0.0005
lr_schedule: cosine

guidedmixup_alpha: 1.0
guidedmixup_prob: 0.5
guidedmixup_blur_kernel: 7
guidedmixup_condition: greedy
basic_aug: false
aug_recipe: fine_grained
sal_basic_aug: false
seed: 0
save_csv: true
run_name: cars196_preact_resnet18_guided_sr
save_checkpoint: true
save_best_only: true
log_time: true
distributed: false
sync_batch_stats: false
