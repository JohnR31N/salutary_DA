dataset: caltech_birds2011
data_dir: ./data
model: preact_resnet18
method: cutmix_sumix
resnet_stem_type: imagenet

batch_size: 64
epochs: 200
validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true
final_test_checkpoint: best

learning_rate: 0.05
momentum: 0.9
weight_decay: 0.0005
lr_schedule: cosine

cutmix_alpha: 1.0
cutmix_prob: 1.0
cutmix_no_repeat: true
sumix_gamma: 0.5
sumix_semantic_scale: 10.0
basic_aug: false
aug_recipe: cub
seed: 0
save_csv: true
run_name: cub200_preact_resnet18_cutmix_sumix
save_checkpoint: true
save_best_only: true
log_time: true
distributed: false
sync_batch_stats: false
