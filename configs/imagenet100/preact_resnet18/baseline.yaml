dataset: imagenet100
data_dir: ./data
model: preact_resnet18
method: baseline
resnet_stem_type: imagenet

batch_size: 128
epochs: 400
validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true
final_test_checkpoint: best

learning_rate: 0.05
momentum: 0.9
nesterov: false
weight_decay: 0.0001
lr_schedule: cosine

basic_aug: false
aug_recipe: imagenet
seed: 0
save_csv: true
run_name: imagenet100_preact_resnet18_baseline
save_checkpoint: true
save_best_only: true
log_time: true
distributed: true
cross_device_shuffle: false
sync_batch_stats: false
