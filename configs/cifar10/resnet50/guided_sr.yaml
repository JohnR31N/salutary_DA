dataset: cifar10
data_dir: ./data
model: resnet50
method: guided_sr

batch_size: 128
epochs: 200
max_train_steps: -1
max_eval_steps: -1

validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true

learning_rate: 0.1
momentum: 0.9
weight_decay: 0.0005
lr_schedule: cosine
min_learning_rate: 0.0
lr_decay_epochs: [100, 150]
lr_decay_rate: 0.1

guidedmixup_alpha: 1.0
guidedmixup_prob: 0.5
guidedmixup_blur_kernel: 7
guidedmixup_condition: greedy

basic_aug: true
sal_basic_aug: false
seed: 0

save_csv: true
output_dir: ./outputs
output_name: ""
run_name: cifar10_resnet50_guided_sr

save_checkpoint: true
checkpoint_dir: ./checkpoints
save_best_only: true
resume_checkpoint: ""

log_time: true
distributed: false
