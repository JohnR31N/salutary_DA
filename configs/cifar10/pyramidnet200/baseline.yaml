dataset: cifar10
data_dir: ./data
model: pyramidnet200
method: baseline

batch_size: 128
epochs: 300
max_train_steps: -1
max_eval_steps: -1

validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true

learning_rate: 0.25
momentum: 0.9
weight_decay: 0.0001
lr_schedule: step
min_learning_rate: 0.0
lr_decay_epochs: [150, 225]
lr_decay_rate: 0.1

basic_aug: true
seed: 0

save_csv: true
output_dir: ./outputs
output_name: ""
run_name: cifar10_pyramidnet200_baseline

save_checkpoint: true
checkpoint_dir: ./checkpoints
save_best_only: true
resume_checkpoint: ""

log_time: true
distributed: true
