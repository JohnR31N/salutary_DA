base: baseline.yaml

method: ifaugnet
run_name: cub200_preact_resnet18_ifaugnet_jax_stable

ifaugnet_stage: all
ifaugnet_pretrain_steps: 2000
ifaugnet_influence_steps: 1000
ifaugnet_retrain_epochs: 200
ifaugnet_retrain_learning_rate: 0.05

ifaugnet_pretrain_learning_rate: 0.0002
ifaugnet_pretrain_beta1: 0.5
ifaugnet_pretrain_beta2: 0.999
# The supplement's 0.01 E/G rate is unstable for the 224x224 raw-field JAX
# path. Keep the paper model and transform, but optimize the influence stage
# with a conservative JAX scale; tune it only on the held-out split.
ifaugnet_learning_rate: 0.0001
ifaugnet_beta1: 0.9
ifaugnet_beta2: 0.99

ifaugnet_tau_dim: 128
ifaugnet_tau_dropout: 0.5
ifaugnet_transform_parameterization: paper
ifaugnet_composition: parallel
ifaugnet_architecture: imagenet
ifaugnet_smoothing_kernel: 4
ifaugnet_damping: 0.01
ifaugnet_cg_iters: 50
ifaugnet_s_test_batches: 16

ifaugnet_image_loss_weight: 1.0
ifaugnet_feature_loss_weight: 1.0
ifaugnet_pretrain_identity_l2_weight: 0.001
ifaugnet_identity_l2_weight: 0.02
ifaugnet_label_preservation_weight: 0.1
ifaugnet_influence_clip_value: 1.0
ifaugnet_learned_aug_probability: 0.1
ifaugnet_gradient_clip_norm: 1.0
ifaugnet_zero_nonfinite_grads: true
ifaugnet_log_every: 25
ifaugnet_health_check_every: 10
ifaugnet_restore_last_healthy_pretrain: true
ifaugnet_max_pretrain_generator_loss: 10.0
ifaugnet_max_pretrain_identity_l2: 0.15
ifaugnet_restore_best_healthy: true
ifaugnet_min_accuracy_retention: 0.90
ifaugnet_max_tau_saturation_fraction: 0.50
ifaugnet_collapse_patience: 5

distributed: true
sync_batch_stats: true
cross_device_shuffle: false
wandb: true
wandb_project: allthemix
