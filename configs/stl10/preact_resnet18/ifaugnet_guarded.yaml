base: baseline.yaml

method: ifaugnet
run_name: stl10_preact_resnet18_ifaugnet_guarded

ifaugnet_stage: all
ifaugnet_pretrain_steps: 0
ifaugnet_influence_steps: 300
ifaugnet_retrain_epochs: 200
ifaugnet_retrain_learning_rate: 0.1
ifaugnet_pretrain_learning_rate: 0.0002
ifaugnet_pretrain_beta1: 0.5
ifaugnet_pretrain_beta2: 0.999
ifaugnet_learning_rate: 0.00003
ifaugnet_beta1: 0.9
ifaugnet_beta2: 0.99
ifaugnet_tau_dim: 128
ifaugnet_tau_dropout: 0.5
ifaugnet_transform_parameterization: guarded
ifaugnet_composition: serial
ifaugnet_architecture: cifar
ifaugnet_spatial_scale: 0.20
ifaugnet_appearance_scale: 0.25
ifaugnet_smoothing_kernel: 4
ifaugnet_damping: 0.01
ifaugnet_cg_iters: 50
ifaugnet_s_test_batches: 16
ifaugnet_image_loss_weight: 1.0
ifaugnet_feature_loss_weight: 1.0
ifaugnet_pretrain_identity_l2_weight: 0.001
ifaugnet_identity_l2_weight: 0.1
ifaugnet_label_preservation_weight: 0.1
ifaugnet_influence_clip_value: 1.0
ifaugnet_learned_aug_probability: 0.05
ifaugnet_gradient_clip_norm: 1.0
ifaugnet_zero_nonfinite_grads: true
ifaugnet_log_every: 100
ifaugnet_health_check_every: 5
ifaugnet_restore_last_healthy_pretrain: true
ifaugnet_max_pretrain_generator_loss: 10.0
ifaugnet_max_pretrain_identity_l2: 0.15
ifaugnet_restore_best_healthy: true
ifaugnet_min_accuracy_retention: 0.80
ifaugnet_max_tau_saturation_fraction: 0.50
ifaugnet_collapse_patience: 3
distributed: true
cross_device_shuffle: false
sync_batch_stats: true
wandb: true
wandb_project: allthemix
