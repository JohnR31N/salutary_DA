dataset: cars196
data_dir: ./data
model: preact_resnet18
method: resizemix
cross_device_shuffle: false
resnet_stem_type: imagenet

batch_size: 64
epochs: 200
validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true
final_test_checkpoint: best

learning_rate: 0.05
momentum: 0.9
weight_decay: 0.0005
lr_schedule: cosine

resizemix_scope_min: 0.1
resizemix_scope_max: 0.8
resizemix_prob: 1.0
basic_aug: false
aug_recipe: fine_grained
seed: 0
save_csv: true
run_name: cars196_preact_resnet18_resize
save_checkpoint: true
save_best_only: true
log_time: true
distributed: false
sync_batch_stats: false
