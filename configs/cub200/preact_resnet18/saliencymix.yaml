dataset: caltech_birds2011
data_dir: ./data
model: preact_resnet18
method: saliencymix
cross_device_shuffle: false
resnet_stem_type: imagenet

batch_size: 64
epochs: 200
validation_split: 0.1
val_source: test
eval_on_test_each_epoch: false
final_test: true
final_test_checkpoint: best

learning_rate: 0.05
momentum: 0.9
weight_decay: 0.0005
lr_schedule: cosine

saliencymix_alpha: 1.0
saliencymix_prob: 0.5
basic_aug: false
sal_basic_aug: false
sal_aug_recipe: cub
saliency_dir: ./data
seed: 0
save_csv: true
run_name: cub200_preact_resnet18_saliencymix
save_checkpoint: true
save_best_only: true
log_time: true
distributed: false
sync_batch_stats: false
